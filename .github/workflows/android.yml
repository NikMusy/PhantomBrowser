name: Build Phantom APK

# Builds the Android edition (android/) into an installable APK and commits
# the result back into the branch under android/dist/ so it can be fetched
# directly via git/raw — no release, no tag (tag/release creation is blocked
# in some environments).

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Stage APK or error log, then commit to branch
        if: always()
        run: |
          set -e
          rm -rf android/dist
          mkdir -p android/dist
          APK="$(find android/app/build/outputs/apk -name '*.apk' 2>/dev/null | head -n1 || true)"

          if [ -n "$APK" ] && [ -f "$APK" ]; then
            cp "$APK" android/dist/PhantomBrowser.apk
            echo "BUILD OK $(date -u) — $(du -h android/dist/PhantomBrowser.apk | cut -f1)" > android/dist/STATUS.txt
            rm -f android/dist/last_build_error.log
          else
            echo "BUILD FAILED $(date -u)" > android/dist/STATUS.txt
            {
              echo "Build of $GITHUB_SHA failed."
              echo "=================== ERROR LINES ==================="
              grep -iE "error:|e: |FAILED|what went wrong|AAPT|Caused by|Unresolved|Execution failed|> Task .*FAILED" /tmp/gradle.log | head -n 100 || true
              echo "=================== TAIL (last 120) ==================="
              tail -n 120 /tmp/gradle.log || true
            } > android/dist/last_build_error.log
            rm -f android/dist/PhantomBrowser.apk
          fi

          git config user.name "phantom-ci"
          git config user.email "ci@phantom.local"
          git add -f android/dist
          git commit -m "ci: APK build result for ${GITHUB_SHA::7} [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhantomBrowser-apk
          path: android/dist/PhantomBrowser.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload full Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn

      - name: Fail job if no APK
        if: always()
        run: test -f android/dist/PhantomBrowser.apk
