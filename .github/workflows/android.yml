name: Build Phantom APK

# Builds the Android edition (android/) into an installable APK.
#
#  • Any branch push   → APK uploaded as a workflow artifact, and (on the
#                        dev branch) published to the "android-latest"
#                        pre-release for a stable direct download link.
#  • Manual dispatch   → same.
#
# This never touches the official versioned releases (e.g. v3.0).

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    name: Assemble & publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced by the build"
            exit 1
          fi
          cp "$APK" out/PhantomBrowser.apk
          echo "Built: $APK ($(du -h out/PhantomBrowser.apk | cut -f1))"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomBrowser-apk
          path: android/out/PhantomBrowser.apk
          if-no-files-found: error
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 👻 Phantom Browser APK"
            echo ""
            if [ -f out/PhantomBrowser.apk ]; then
              echo "✅ **Build succeeded.**"
              echo ""
              echo "**Скачать:** этот прогон → раздел **Artifacts** → \`PhantomBrowser-apk\`"
              echo "(внутри zip — \`PhantomBrowser.apk\`, debug-подпись, Android 7.0+)."
            else
              echo "❌ Build failed — смотри логи выше."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Publish to a rolling pre-release ──────────────────────────────
      # Publishes the freshly-built APK as an asset on a dedicated
      # "android-latest" pre-release. This is separate from the official
      # versioned releases (e.g. v3.0 with the Windows installer), which it
      # never touches. Gives a stable, direct download URL for the APK.
      - name: Publish APK to android-latest pre-release
        if: github.ref_name == 'claude/apk-repository-integration-yqvws' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 👻 Phantom Browser — Android (latest)
          prerelease: true
          body: |
            👻 **Phantom Browser для Android** — нативное приложение (Kotlin + WebView).

            Автоматическая сборка из ветки разработки. Обновляется при каждом пуше.

            ### Установка
            1. Скачай **PhantomBrowser.apk** ниже.
            2. На телефоне разреши установку из неизвестных источников.
            3. Открой файл — готово.

            Тёмная тема Catppuccin · своя поисковая система Phantom Search · вкладки · Ghost Mode 🌙
            Требуется Android 7.0+ (API 24). APK подписан debug-ключом.
          files: android/out/PhantomBrowser.apk
          fail_on_unmatched_files: true
